<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruri Atlas — 日本語の意味を、ブラウザで見る</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a14;--panel:rgba(14,20,36,.72);--line:rgba(148,163,255,.16);--text:#e6ebff;--dim:#8d97bd;--accent:#8ab4ff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 70% -10%,#16204a 0%,transparent 60%),radial-gradient(900px 600px at 0% 110%,#2a1646 0%,transparent 55%),var(--bg);color:var(--text);font-family:"Noto Sans JP",system-ui,sans-serif;overflow:hidden}
#bg,#stars{position:fixed;inset:0;z-index:0;width:100%;height:100%}#stars{opacity:0}.nogpu #stars{opacity:1}
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#04070f;transition:opacity 1.1s ease,visibility 1.1s}
#intro.off{opacity:0;visibility:hidden}#intro h2{margin:0;font-weight:300;font-size:44px;letter-spacing:.34em;text-indent:.34em}#intro h2 b{font-weight:700;background:linear-gradient(90deg,#8ab4ff,#d9a7ff,#8ab4ff);background-size:200%;-webkit-background-clip:text;color:transparent;animation:sh 3s linear infinite}
@keyframes sh{to{background-position:200%}}#intro p{margin:0;color:var(--dim);font-size:13px;letter-spacing:.12em}
#ring{width:64px;height:64px}#ring circle{fill:none;stroke-width:2.4;stroke-linecap:round}#ring .t{stroke:rgba(138,180,255,.14)}#ring .p{stroke:url(#g);stroke-dasharray:176;stroke-dashoffset:176;transition:stroke-dashoffset .35s;transform:rotate(-90deg);transform-origin:50% 50%}
#atlas{position:fixed;inset:0;z-index:1;cursor:grab;touch-action:none}
header{position:fixed;z-index:3;left:28px;top:22px;right:28px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
h1{margin:0;font-weight:300;font-size:26px;letter-spacing:.12em}h1 b{font-weight:700;background:linear-gradient(90deg,#8ab4ff,#d9a7ff);-webkit-background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:12.5px;margin-top:6px;letter-spacing:.04em}
#status{pointer-events:auto;font-size:12px;color:var(--dim);text-align:right;line-height:1.7}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--text);backdrop-filter:blur(8px)}
.badge.gpu{border-color:#5eead4;color:#5eead4}.badge.wasm{border-color:#fcd34d;color:#fcd34d}
#bar{height:3px;width:220px;margin:8px 0 0 auto;border-radius:3px;background:var(--line);overflow:hidden}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8ab4ff,#d9a7ff);transition:width .3s}
#legend{position:fixed;z-index:3;left:28px;top:84px;display:flex;flex-wrap:wrap;gap:8px 14px;max-width:560px;font-size:12px;color:var(--dim)}
#legend span{display:flex;align-items:center;gap:6px}#legend i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor;background:currentColor}
#search{position:fixed;z-index:4;left:50%;bottom:28px;transform:translateX(-50%);width:min(720px,calc(100vw - 40px));display:flex;flex-direction:column;gap:10px}
#qrow{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 10px;backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
#q{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:17px;padding:8px 10px}
#q::placeholder{color:#6772a0}
button{font:inherit;color:var(--text);background:rgba(138,180,255,.14);border:1px solid var(--line);border-radius:12px;padding:8px 16px;cursor:pointer}
button:hover{background:rgba(138,180,255,.26)}button:disabled{opacity:.4;cursor:default}
#chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-self:center;width:max-content;max-width:calc(100vw - 40px)}.chip{font-size:12.5px;padding:5px 12px;border-radius:99px;background:rgba(138,180,255,.08);border:1px solid var(--line);color:var(--dim);cursor:pointer}.chip:hover{color:var(--text);border-color:var(--accent)}
#panel,#ipanel{position:fixed;z-index:3;right:24px;top:var(--ptop,170px);bottom:130px;width:370px;background:linear-gradient(160deg,rgba(24,32,64,.72),rgba(10,14,30,.78));border:1px solid rgba(148,163,255,.22);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);border-radius:20px;backdrop-filter:blur(14px);padding:16px 16px 10px;overflow:auto;transform:translateX(420px);visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
#panel.on,#ipanel.on{transform:none;visibility:visible;transition-delay:0s}#panel h2,#ipanel h2{margin:0 0 4px;font-size:13px;font-weight:500;color:var(--dim);letter-spacing:.08em}
.tog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-bottom:10px}.tog input{accent-color:#8ab4ff}
.hit{position:absolute;left:16px;right:16px;padding:10px 12px 10px 14px;border-radius:12px;background:rgba(138,180,255,.07);border:1px solid var(--line);border-left:3px solid var(--c,#8ab4ff);animation:up .6s backwards;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .4s;font-size:13.5px;line-height:1.55}
.hit .rk{float:left;margin-right:10px;font-size:22px;font-weight:300;color:var(--accent);width:22px}
.hit .m{display:flex;gap:10px;margin-top:6px;font-size:11px;color:var(--dim);align-items:center}.m .b{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}.m .b i{display:block;height:100%;border-radius:4px}
@keyframes up{from{opacity:0;margin-top:14px}to{opacity:1;margin-top:0}}
#tip{position:fixed;z-index:5;pointer-events:none;max-width:320px;padding:8px 12px;border-radius:10px;background:rgba(10,14,28,.92);border:1px solid var(--line);font-size:13px;line-height:1.55;opacity:0;transition:opacity .15s}
#foot{position:fixed;z-index:3;right:24px;bottom:22px;font-size:11px;color:#58638f;text-align:right;line-height:1.7;max-width:420px}
#foot a{color:#7c8ac8}
#model{margin-top:8px;max-width:260px;font:inherit;font-size:12px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px;backdrop-filter:blur(8px);pointer-events:auto}#model option{background:#0e1424}
#status .row{display:flex;gap:6px;justify-content:flex-end;align-items:center}
@media(max-width:900px){
 header{left:14px;right:14px;top:12px}h1{font-size:19px}.sub{display:none}
 #status{font-size:11px}#bar{width:120px}#model{max-width:180px;font-size:11.5px}
 #legend{display:none}#foot{display:none}
 #panel,#ipanel{left:10px;right:10px;width:auto;top:auto;bottom:calc(120px + env(safe-area-inset-bottom));height:46vh;transform:translateY(150%);padding:12px 12px 8px}
 #ipanel{height:42vh}
 #panel.on,#ipanel.on{transform:none;visibility:visible;transition-delay:0s}
 .hit{left:10px;right:10px}
 #search{bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100vw - 20px)}
 #chips{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:2px;scrollbar-width:none}.chip{white-space:nowrap;flex:none}
 #q{font-size:16px}#intro h2{font-size:30px}
}
#wait{position:fixed;left:0;right:0;top:0;height:3px;z-index:30;display:none;overflow:hidden;pointer-events:none;background:rgba(138,180,255,.15)}
#wait i{display:block;height:100%;width:35%;background:linear-gradient(90deg,#8ab4ff,#d9a7ff);box-shadow:0 0 10px #8ab4ff;animation:ind 1.2s ease-in-out infinite}
#wait.det i{animation:none;transition:width .3s;width:0}
@keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}
body.loading #wait{display:block}body.loading #atlas{opacity:.75;transition:opacity .3s}

#ipanel{padding-top:14px}#ixbtn{position:absolute;right:10px;top:8px;width:28px;height:28px;padding:0;border-radius:50%;font-size:16px;line-height:1}
#ipanel select{width:100%;margin:2px 0 8px;font:inherit;font-size:12.5px;color:var(--text);background:rgba(10,14,28,.7);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
#ipanel .row2{display:flex;gap:6px;margin-bottom:8px}#ipanel .row2 button{flex:1;padding:5px 0;font-size:12px}#ipanel .row2 button.on{background:rgba(255,77,109,.28);border-color:#ff4d6d}
#ipanel .host{font-size:12.5px;line-height:1.6;padding:8px 10px;border-radius:10px;background:rgba(138,180,255,.07);border-left:3px solid #fff;margin-bottom:8px}
#ipanel .inj{font-size:12.5px;line-height:1.6;padding:8px 10px;border-radius:10px;background:rgba(255,77,109,.1);border-left:3px solid #ff4d6d;margin-bottom:8px;color:#ffc2cc}
#ipanel table{width:100%;border-collapse:collapse;font-size:12px}#ipanel td{padding:3px 4px;border-bottom:1px solid var(--line)}#ipanel td:last-child{text-align:right;white-space:nowrap}
#ipanel .up{color:#ff8da1}#ipanel .dn{color:#86efac}#ipanel .note{font-size:11px;color:#6f7aa6;margin-top:8px;line-height:1.6}
#ipanel .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}#ipanel h3{margin:10px 0 4px;font-size:12px;font-weight:500;color:var(--dim)}
#corp.seg{display:inline-flex;margin-right:6px;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--panel)}#corp button{border:0;border-radius:0;padding:4px 10px;font-size:11.5px;background:transparent;color:var(--dim)}#corp button.on{background:rgba(138,180,255,.28);color:var(--text)}
.lg{font-style:normal;font-size:10px;padding:1px 5px;margin-right:6px;border-radius:5px;border:1px solid var(--line);color:var(--dim)}
#injBtn{margin-top:8px;font-size:12px;padding:5px 12px;border-radius:99px;border-color:rgba(255,77,109,.5)}#injBtn.on{background:rgba(255,77,109,.28)}
#ipanel .scroll{overflow:auto;max-height:calc(100% - 30px)}
</style>
</head>

  $("ipanel").classList.toggle("on", on); if (on) { query = null; hits = []; $("panel").classList.remove("on"); runInjection(); } else { injState.res = null; }
}
$("injBtn").onclick = () => setInjMode(!injState.on); $("ixbtn").onclick = () => setInjMode(false);

// ---------- search, reranker toggle (re-orders live), model switching
const sigmoid = x => 1 / (1 + Math.exp(-x));
async function loadReranker() {
  if (rrCache[corpus]) return true;
  setLoading(true); msg(L("rrLoad")); Object.keys(fileProg).forEach(k => delete fileProg[k]);
  const id = rrNow().id, tries = [[device, dtype], ["wasm", "q8"], ["wasm", "fp32"]].filter((t, i, a) => a.findIndex(u => u[0] === t[0] && u[1] === t[1]) === i);
  let tok = null;
  for (const [d, t] of tries) {
    try {
      tok = tok || await AutoTokenizer.from_pretrained(id);
      const model = await AutoModelForSequenceClassification.from_pretrained(id, { device: d, dtype: t, progress_callback: cb });
      rrCache[corpus] = { tok, model }; setLoading(false); return true;
    } catch (e) { console.warn("reranker load failed", d, t, e); }
  }
  setLoading(false); $("rr").checked = false; msg(L("rrFail")); return false;
}
let busy = false, pool = [], curQ = "", tE = 0, tR = 0;
async function rerankPool() {
  if (!(rrCache[corpus] || await loadReranker())) return false;
  const { tok: rtok, model: rmodel } = rrCache[corpus];
  const tB = performance.now();
  const inp = rtok(pool.map(() => curQ), { text_pair: pool.map(h => DOCS[h.i].text), padding: true, truncation: true });
  const { logits } = await rmodel(inp); const l = Array.from(logits.data); pool.forEach((h, k) => h.r = sigmoid(l[k])); tR = performance.now() - tB; return true;
}
const useRerank = () => $("rr").checked && pool.length > 0 && pool.every(h => h.r != null);
async function applyOrder(fresh) {
  if ($("rr").checked && pool.some(h => h.r == null)) await rerankPool();
  const ord = [...pool].sort((a, b) => useRerank() ? b.r - a.r : b.s - a.s);
  hits = ord.slice(0, 6); if (fresh) buildCards(); layoutCards(ord);
  $("ptitle").textContent = L("near", curQ); $("panel").classList.add("on");
  msg(L("searchMs", tE.toFixed(0), useRerank() ? tR.toFixed(0) : null)); prog(0);
}
async function search() {
  const q = $("q").value.trim(); if (!q || busy || !cur) return; if (injState.on) setInjMode(false); busy = true; $("go").disabled = true;
  const tA = performance.now(); const [qv] = await embed([q], "q"); tE = performance.now() - tA;
  const sims = docVecs.map(v => v.reduce((s, x, i) => s + x * qv[i], 0));
  pool = sims.map((s, i) => ({ i, s, r: null })).sort((a, b) => b.s - a.s).slice(0, 10); curQ = q;
  const top = pool.slice(0, 6), w = top.map(h => Math.exp(h.s * 14)), ws = w.reduce((a, b) => a + b, 0);   // query position: similarity-weighted centroid
  const cen = k => top.reduce((s, h, j) => s + nodes[h.i][k] * w[j] / ws, 0); query = { x: cen("x"), y: cen("y"), z: cen("z") }; pulse = 0; orbitTo(query); qT = performance.now();
  await applyOrder(true); busy = false; $("go").disabled = false;
}
$("rr").addEventListener("change", () => { if (pool.length && !busy) applyOrder(false); });

const cardEls = new Map(); const stepNow = () => innerWidth <= 900 ? 106 : 116;
function cardHtml(h) { const c = TOPICS[DOCS[h.i].topic][1], tag = corpus === "both" ? `<em class="lg">${DOCS[h.i].lang === "ja" ? "JA" : "EN"}</em>` : ""; return `<span class="rk"></span><span>${tag}${DOCS[h.i].text}</span><div class="m sim"><span>${L("sim")}</span><span class="b"><i style="width:${Math.max(4, h.s * 100)}%;background:${c}"></i></span><span>${h.s.toFixed(2)}</span></div><div class="m rer"><span>${L("rer")}</span><span class="b"><i style="background:#d9a7ff"></i></span><span class="rv"></span></div>`; }
function buildCards() { const box = $("hits"); box.innerHTML = ""; cardEls.clear(); pool.forEach((h, k) => { const el = document.createElement("div"); el.className = "hit"; el.style.setProperty("--c", TOPICS[DOCS[h.i].topic][1]); el.style.animationDelay = (k * 60) + "ms"; el.innerHTML = cardHtml(h); box.appendChild(el); cardEls.set(h.i, el); }); }
function layoutCards(ord) {
  const STEP = stepNow(); $("hits").style.height = 6 * STEP + "px"; const on = useRerank(), mx = Math.max(...ord.map(h => h.r ?? 0), .05);
  ord.forEach((h, k) => { const el = cardEls.get(h.i); el.querySelector(".rk").textContent = k + 1; const rer = el.querySelector(".rer"); rer.style.display = on ? "flex" : "none";
    if (h.r != null) { rer.querySelector("i").style.width = Math.max(3, h.r / mx * 100) + "%"; rer.querySelector(".rv").textContent = h.r.toFixed(2); }
    el.style.transform = `translateY(${k * STEP}px)`; el.style.opacity = k < 6 ? 1 : 0; el.style.pointerEvents = k < 6 ? "auto" : "none"; });
}

let prevKey = null;
async function switchModel(key, first, force) {
  if (!first && !force && (key === cur || busy)) return; if (busy && !first) return; busy = true; setLoading(true); const prev = cur;
  for (const id of ["go", "q", "model", "injBtn"]) $(id).disabled = true; document.querySelectorAll("#corp button").forEach(b => b.disabled = true);
  try {
    const M = MODELS[key]; cur = key; const t0 = performance.now(); msg(L("loadModel", M.label)); await getPipe(key);
    msg(L("embN", DOCS.length)); const vecs = await embed(DOCS.map(d => d.text), "d", key); embedMs = performance.now() - t0; docVecs = vecs;
    const sameSize = nodes.length === vecs.length; if (!sameSize) nodes.length = 0;
    setLayout(layout(vecs), !first && sameSize); query = null; hits = []; pool = []; $("panel").classList.remove("on"); updateFoot(); $("model").value = key; injState.key = null; if (injState.on) { injState.res = null; setTimeout(runInjection, 0); }
    msg(L("ready", M.label, DOCS.length, embedMs.toFixed(0)));
  } catch (e) {
    console.warn("model failed", e); cur = prev; if (prev) $("model").value = prev; msg(L("modelFail"));
    if (first) throw e;
  } finally { setLoading(false); for (const id of ["go", "q", "model", "injBtn"]) $(id).disabled = false; document.querySelectorAll("#corp button").forEach(b => b.disabled = false); prog(0); busy = false; }
}
async function switchCorpus(c) {
  if (c === corpus || busy) return; corpus = c; try { history.replaceState(null, "", "?lang=" + c); } catch {}
  buildDocs(); fillModels(); injState.host = -1; injState.res = null; injState.key = null; pool = []; hits = []; query = null; $("panel").classList.remove("on"); $("q").value = "";
  const def = { ja: "ruri30", en: "bgeS", both: "e5s" }[c], key = MODELS[cur]?.langs.includes(c) ? cur : def; applyI18n(); await switchModel(key, false, true);
}
$("model").addEventListener("change", e => switchModel(e.target.value));
$("go").onclick = search; $("q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
$("chips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) { $("q").value = c.textContent; search(); } }); // delegated: chips are re-rendered by applyI18n()
applyI18n(); msg(L("prep")); fillModels(); await switchModel({ ja: "ruri30", en: "bgeS", both: "e5s" }[corpus], true);
setTimeout(() => $("intro").classList.add("off"), 500);
</script>
